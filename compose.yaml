services:
  fleet-manager:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true
    stop_grace_period: 15s

    env_file:
      - .env

    networks:
      - imms-shared

    volumes:
      - type: bind
        source: ./certs/fleet-server.crt
        target: /run/fleet/tls/server.crt
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./certs/fleet-server.key
        target: /run/fleet/tls/server.key
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./certs/core-client-ca.crt
        target: /run/fleet/tls/core-client-ca.crt
        read_only: true
        bind:
          create_host_path: false

    ports:
      - "127.0.0.1:18081:18081"
      - "127.0.0.1:14320:4320"

networks:
  imms-shared:
    external: true