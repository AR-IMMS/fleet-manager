services:
  fleet-manager:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

    networks:
      - imms-shared

    environment:
      FLEET_HTTP_LISTEN_ADDRESS: 0.0.0.0:18081
      FLEET_API_DOCS_ENABLED: ${FLEET_API_DOCS_ENABLED:-false}
      FLEET_MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      FLEET_MONGODB_DATABASE: ar_imms_fleet
      FLEET_LOG_FORMAT: json
      OPAMP_ENABLED: "false"

    ports:
      - "127.0.0.1:18081:18081"

networks:
  imms-shared:
    external: true
