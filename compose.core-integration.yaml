services:
  fleet-manager:
    env_file:
      - .env.local
    environment:
      FLEET_HTTP_CLIENT_CA_FILE: /run/fleet/tls/core-client-ca.crt
      FLEET_ENROLLMENT_ENABLED: "true"
      FLEET_ENROLLMENT_OPAMP_ENDPOINT: wss://127.0.0.1:18082/v1/opamp
      FLEET_ENROLLMENT_CORE_CLIENT_CN: core-backend-local
      OPAMP_ENABLED: "true"
      OPAMP_LISTEN_ADDRESS: 0.0.0.0:18082
      OPAMP_TLS_CERT_FILE: /run/fleet/tls/server.crt
      OPAMP_TLS_KEY_FILE: /run/fleet/tls/server.key
    volumes:
      - type: bind
        source: ../ar-imms/core-backend/.temp/fleet-mtls/core-client-ca.crt
        target: /run/fleet/tls/core-client-ca.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18082:18082"